# Two gates, both of which this repository applies to other people.
#
# The tests gate the tools. The prose gate runs the repository's own checker
# over its own Markdown, because a project that publishes a writing standard
# and does not meet it has published an opinion rather than a tool.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what macOS ships. The tools claim to be stdlib-only and to
        # run wherever Python does, so the oldest supported version is part
        # of the claim rather than an afterthought.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-randomly coverage
      - name: tests
        run: python -m pytest tests/ -q
      - name: branch coverage must stay at 100
        if: matrix.python-version == '3.13'
        run: |
          coverage run --branch --source=tools,mcp,hooks -m pytest tests/ -q
          coverage report --fail-under=100 --show-missing

  # The commit-message checker was the one gate with nothing behind it. It runs
  # as a local commit-msg hook, so it covers anyone who ran `pre-commit
  # install` and nobody else: a fresh clone, a contributor who skipped the
  # setup, or a machine where the hook was removed all commit unchecked, and
  # nothing anywhere reports it. Every other gate here has a second copy in CI.
  # This is that copy.
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to see the commits this push or pull request added.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: the checker reads the messages of the commits being added
        run: |
          # Only what this change introduces. Running it over the whole history
          # would fail on commits written before the rule existed, and a gate
          # that always fails is a gate people learn to ignore.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "no base commit to compare against; checking the tip only"
            range="-1"
          else
            range="$base..${{ github.sha }}"
          fi
          fail=0
          for sha in $(git rev-list $range); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            if ! python tools/commit_msg.py /tmp/msg.txt; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              fail=1
            fi
          done
          exit $fail

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: the checker scores its own repository
        run: python tools/clarity.py README.md docs/*.md skills/*/SKILL.md
